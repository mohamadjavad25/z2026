<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="12" y1="0" x2="116" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243036"/>
      <stop offset="42%" stop-color="#2b222f"/>
      <stop offset="100%" stop-color="#151a1e"/>
    </linearGradient>
    <linearGradient id="hair" x1="28" y1="12" x2="100" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6a455f"/>
      <stop offset="40%" stop-color="#51364d"/>
      <stop offset="100%" stop-color="#2a1c28"/>
    </linearGradient>
    <linearGradient id="face" x1="52" y1="34" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe8db"/>
      <stop offset="100%" stop-color="#d99c91"/>
    </linearGradient>
    <linearGradient id="ring" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0c987"/>
      <stop offset="50%" stop-color="#c85c76"/>
      <stop offset="100%" stop-color="#167a78"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="50" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c85c76" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#c6923c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#151a1e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg)"/>
  <circle cx="64" cy="54" r="52" fill="url(#glow)"/>
  <circle cx="64" cy="54" r="47" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.88"/>

  <!-- shoulder / neck base -->
  <ellipse cx="64" cy="118" rx="34" ry="18" fill="#3a2a38"/>

  <!-- hair silhouette -->
  <path fill="url(#hair)" d="M30 48c1-22 18-36 34-36 17 0 33 14 34 36 1 12-1 24-6 36-4 10-10 18-16 22v8c-8-8-14-20-16-34-1 12-6 26-14 36-10-6-16-18-18-32-2-12 0-24 2-36z"/>

  <!-- face -->
  <ellipse cx="66" cy="56" rx="18" ry="22" fill="url(#face)"/>

  <!-- soft blush -->
  <ellipse cx="58" cy="61" rx="4.5" ry="3" fill="#c85c76" opacity="0.28"/>
  <ellipse cx="74" cy="61" rx="4.5" ry="3" fill="#c85c76" opacity="0.28"/>

  <!-- bangs -->
  <path fill="#3f2a3b" d="M48 44c8-14 20-18 30-16-2 8-8 14-16 17-5 2-10 2-14-1z"/>
  <path fill="#2b1c28" opacity="0.55" d="M78 42c4 2 8 8 9 14-6-2-10-6-12-12 1-1 2-2 3-2z"/>

  <!-- gold spark accents -->
  <g fill="#f0c987">
    <path d="M98 30l2.1 4.4 4.4 2.1-4.4 2.1-2.1 4.4-2.1-4.4-4.4-2.1 4.4-2.1z"/>
    <path d="M30 38l1.4 2.9 2.9 1.4-2.9 1.4-1.4 2.9-1.4-2.9-2.9-1.4 2.9-1.4z" opacity="0.8"/>
    <circle cx="92" cy="54" r="1.8" opacity="0.85"/>
  </g>
</svg>
