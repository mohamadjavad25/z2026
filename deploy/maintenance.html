<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرفرو | چند دقیقه دیگر</title>
<style>
  :root { --ink: #0c0d12; --paper: #ffffff; --soft: #6b6f80; --pink: #ff86b8; --violet: #8b6cff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ffffff; --paper: #0c0d12; --soft: #a3a7b7; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: Vazirmatn, Tahoma, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; background: linear-gradient(90deg, var(--pink), var(--violet));
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: var(--soft); line-height: 1.9; margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>فرفرو چند دقیقه دیگر برمی‌گردد</h1>
    <p>داریم سامانه را به‌روز می‌کنیم. نوبت‌ها و اطلاعاتت سر جایشان هستند.<br>چند دقیقه دیگر دوباره سر بزن.</p>
  </main>
</body>
</html>
