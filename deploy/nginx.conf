# nginx site for frfro.ir (copy to /etc/nginx/sites-available/frfro and link it into sites-enabled).
# TLS lines are added by certbot (`certbot --nginx -d frfro.ir -d www.frfro.ir`).
server {
    listen 80;
    server_name frfro.ir www.frfro.ir;

    # Pictures are uploaded as base64 inside JSON (up to 5 MB each, a little more once encoded).
    client_max_body_size 12m;

    # Maintenance (moving servers, docs/SERVER_MOVE.md): while this file exists every visitor gets the
    # "back in a few minutes" page and nothing reaches the app, so nothing is written to the database.
    # Both live in /var/www/frfro, which nginx can read (the app's home may be closed to it). Once:
    # sudo mkdir -p /var/www/frfro && sudo cp deploy/maintenance.html /var/www/frfro/
    # On: sudo touch /var/www/frfro/maintenance   Off: sudo rm /var/www/frfro/maintenance
    if (-f /var/www/frfro/maintenance) { return 503; }
    # A named location: a plain one would pass through the check above again and loop.
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/frfro;
        # The app's own calls (POST and others) get a short JSON answer; pages get maintenance.html.
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) { return 503 '{"error":"سامانه چند دقیقه در حال به‌روزرسانی است."}'; }
        rewrite ^ /maintenance.html break;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app throttles login, sign-up and SMS codes per address and trusts X-Real-IP for it:
        # always overwrite it with the real address, never pass on what the visitor sent.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js build files never change under the same name: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
