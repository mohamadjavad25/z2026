# The OLD server's nginx site for the hours after a move (docs/SERVER_MOVE.md): phones and DNS caches
# that still have the old address are passed on to the new server, so nobody writes to the old database.
# Replace NEW_SERVER_IP, then: cp to /etc/nginx/sites-available/frfro, nginx -t, systemctl reload nginx.
# On the new server, add `set_real_ip_from OLD_SERVER_IP; real_ip_header X-Real-IP;` to its server
# block for this time, or every forwarded visitor shares the old server's address in the rate limits.
server {
    listen 80;
    server_name frfro.ir www.frfro.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name frfro.ir www.frfro.ir;
    ssl_certificate /etc/letsencrypt/live/frfro.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frfro.ir/privkey.pem;
    client_max_body_size 12m;

    location / {
        proxy_pass https://NEW_SERVER_IP;
        proxy_ssl_server_name on;
        proxy_ssl_name frfro.ir;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
