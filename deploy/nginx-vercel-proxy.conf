# A stopgap, not the plan (docs/FILTERING.md): the Iranian server stands in front of Vercel, so
# visitors in Iran reach frfro.ir through an Iranian IP even if Vercel's own addresses are filtered.
# The app and the database stay on Vercel and Supabase; during an international cut this does nothing.
#
# Before pointing DNS here, check from the server that Vercel answers it (Vercel has turned Iranian
# addresses away with 403 before):
#   curl -sI --resolve frfro.ir:443:76.76.21.21 https://frfro.ir/api/health
#
# Host and SNI must stay frfro.ir: Vercel picks the project by them, and z2026.vercel.app redirects
# to frfro.ir (next.config.mjs), which would loop. Vercel keeps renewing its frfro.ir certificate only
# while the domain's DNS stays on Vercel's nameservers (it renews over DNS, not over this server).
#
# Known cost: Vercel sees this server as every visitor, so the per-address limits on login, sign-up
# and SMS codes (app/lib/rateLimit.js) are shared by everyone. Fine for a few hours of filtering,
# not for weeks; see docs/FILTERING.md.
#
# Use: cp to /etc/nginx/sites-available/frfro, link into sites-enabled, nginx -t, systemctl reload nginx.
# This server's own certificate: certbot certonly --manual --preferred-challenges dns -d frfro.ir -d www.frfro.ir
server {
    listen 80;
    server_name frfro.ir www.frfro.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name frfro.ir www.frfro.ir;
    ssl_certificate /etc/letsencrypt/live/frfro.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frfro.ir/privkey.pem;
    client_max_body_size 12m;

    location / {
        # Vercel's anycast address (the A record Vercel gives for apex domains).
        proxy_pass https://76.76.21.21;
        proxy_ssl_server_name on;
        proxy_ssl_name frfro.ir;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host frfro.ir;
        proxy_set_header X-Forwarded-Proto https;
        # Vercel replaces these with this server's address anyway; sent for the logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
