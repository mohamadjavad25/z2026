name: Expire stale booking requests

# Provider-agnostic scheduler for app/api/cron/expire-bookings, since this
# repo doesn't depend on any one deploy target (Supabase pg_cron needs a
# real Supabase project; Vercel Cron needs a real Vercel deployment --
# neither existed yet when this was added, see docs/DEVLOG.md). A GitHub
# Actions schedule works against whatever the app ends up deployed to, as
# long as the CRON_SECRET repo secret is set.
#
# APP_URL is the site's public domain (https://frfro.ir), so it lives here
# rather than in a secret. CRON_SECRET (repo Settings -> Secrets and
# variables -> Actions) must match the app's own CRON_SECRET env var -- see
# .env.example. Until it is set, every run below no-ops instead of failing
# loudly on every schedule tick.
#
# 3 minutes (RECOMMENDED_SWEEP_INTERVAL_MS in app/lib/bookingExpirySweep.js)
# is below GitHub's practical reliability floor for scheduled workflows
# (GitHub's own docs: schedules can be delayed, especially below ~5min,
# during high load) -- 5 minutes is the closest reliable match. A booking
# request sitting expired for a few extra minutes before this sweep picks
# it up is a cosmetic delay, not a correctness issue (see
# app/lib/bookingExpirySweep.js's own doc comment).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/expire-bookings
        env:
          APP_URL: https://frfro.ir
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret not set yet -- skipping (see comment at the top of this workflow file)."
            exit 0
          fi
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/expire-bookings" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      # Moves any picture still stored in the database into Supabase Storage (a no-op once none are
      # left, or while SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set on the app).
      - name: Call /api/cron/migrate-media
        env:
          APP_URL: https://frfro.ir
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            exit 0
          fi
          curl -sS --max-time 90 -X POST "$APP_URL/api/cron/migrate-media" \
            -H "Authorization: Bearer $CRON_SECRET" || true
