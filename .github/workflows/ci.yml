name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Runs against a real, disposable Postgres 16 container via
      # Testcontainers -- ubuntu-latest runners have Docker available by
      # default, which is all Testcontainers needs.
      - run: npm test
