name: CI

# Runs on every pull request and on pushes to main. Branch pushes are covered by their pull request,
# so the same commit is not tested twice. A red run means: do not merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the rules guard compares the change with its base

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      # CLAUDE.md's hard rules that a machine can check (scripts/guard/rules.mjs): name, colours, «وصل شدن»,
      # downloads switch, app version, migration numbers, signing key. Blocks only what this change adds.
      - run: node scripts/guard/check-rules.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      # Browser for the end-to-end tests in tests/e2e (real Chromium against the built app).
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # Runs against a real, disposable Postgres 16 container via
      # Testcontainers -- ubuntu-latest runners have Docker available by
      # default, which is all Testcontainers needs.
      - run: npm test
