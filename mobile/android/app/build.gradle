apply plugin: 'com.android.application'

android {
    namespace = "ir.frfro.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.frfro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Raise versionCode for every store upload (it must always go up); versionName stays 1.0.0 (owner's rule).
        // The site reads versionCode to ask older apps to update (app/shared/lib/appUpdate.js).
        versionCode 5
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two apps from one shell (mobile/README.md):
    //  - user: «فرفرو», the app in the stores (opens https://frfro.ir).
    //  - admin: «فرفرو مدیر», private, never in a store; opens https://frfro.ir/admin and gets the operator's news.
    //    Its name and icon colour are in src/admin/res, its config in src/admin/assets (scripts/admin-config.mjs).
    flavorDimensions = ["app"]
    productFlavors {
        user {
            dimension "app"
            manifestPlaceholders = [linkPathPrefix: "/"]
        }
        admin {
            dimension "app"
            applicationId "ir.frfro.admin"
            manifestPlaceholders = [linkPathPrefix: "/admin"]
        }
    }
    // Release signing comes from environment variables (set by .github/workflows/mobile-android.yml
    // from repository secrets). The keystore itself is never committed.
    def keystorePath = System.getenv("FRFRO_ANDROID_KEYSTORE")
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("FRFRO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FRFRO_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("FRFRO_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Until the admin app (ir.frfro.admin) is added to the Firebase project and the new google-services.json
        // is committed, the admin app builds without push (FrfroPushPlugin then reports not ready) instead of failing.
        if (!servicesJSON.text.contains('"ir.frfro.admin"')) {
            tasks.configureEach { task ->
                if (task.name ==~ /process.*Admin.*GoogleServices/) task.enabled = false
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
