<title>عنوان صفحه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* frfro decision page. Layout: the problem on top, then the proposals as a swipeable carousel (one per slide,
   each with today / after phone screens and an answer), then the owner's own words, and a bottom tray.
   Only the PAGE object in the script changes from page to page; leave the rest as it is. */
:root {
  --ink: #0c0d12;
  --paper: #ffffff;
  --soft: #f5f4f9;
  --line: #e3e1ec;
  --muted: #5e5c6d;
  --pink: #ff86b8;
  --violet: #8b6cff;
  --blend: linear-gradient(90deg, #ff86b8, #8b6cff);
  --on-accent: #ffffff;
  --phone: #ffffff;
  --phone-edge: #1b1c24;
  --bubble: #eceaf3;
  --bad: #c2334d;
  --bad-bg: #fbe7eb;
  --good: #1f8a5b;
  --good-bg: #e6f5ed;
  --wait: #9a6400;
  --wait-bg: #fcf0dc;
  --font: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #f2f1f7; --paper: #0c0d12; --soft: #16171f; --line: #2b2c38; --muted: #a6a4b6;
  --phone: #1a1b23; --phone-edge: #3a3b48; --bubble: #262733;
  --bad: #ff7d94; --bad-bg: #2c1219; --good: #5fd39b; --good-bg: #11261c; --wait: #f2b25a; --wait-bg: #2a2010;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ink: #f2f1f7; --paper: #0c0d12; --soft: #16171f; --line: #2b2c38; --muted: #a6a4b6;
  --phone: #1a1b23; --phone-edge: #3a3b48; --bubble: #262733;
  --bad: #ff7d94; --bad-bg: #2c1219; --good: #5fd39b; --good-bg: #11261c; --wait: #f2b25a; --wait-bg: #2a2010;
  color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.9; }
.wrap { direction: rtl; max-width: 860px; margin: 0 auto; padding-block: 24px 150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; }
h1 { font-size: clamp(25px, 6vw, 34px); font-weight: 800; line-height: 1.45; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
section { display: grid; gap: 14px; min-width: 0; }

/* problem */
.problem { border-radius: 22px; padding: 20px; background: var(--soft); display: grid; gap: 14px; }
.problem .lead { font-size: 18px; }
.issues { display: grid; gap: 10px; }
.issue { background: var(--paper); border-radius: 14px; padding: 12px 14px; border-inline-start: 4px solid var(--bad); display: grid; gap: 2px; }
.issue.mid { border-inline-start-color: var(--wait); }
.issue b { font-weight: 700; }
.cast { display: flex; flex-wrap: wrap; gap: 8px; }
.who { background: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
.who b { font-weight: 700; }

/* carousel */
.carousel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.nav { display: flex; gap: 8px; align-items: center; }
.nav button { font: inherit; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 20px; line-height: 1; }
.nav button:disabled { opacity: .35; cursor: default; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.track { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding-bottom: 6px; overscroll-behavior-x: contain; scrollbar-width: thin; }
.slide { flex: 0 0 min(92%, 760px); scroll-snap-align: center; border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; background: var(--paper); }
.slide[data-answer="yes"] { border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 22%, transparent); }
.slide[data-answer="no"] { opacity: .8; }
.dots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dot[aria-current="true"] { background: var(--violet); width: 26px; border-radius: 999px; }
.dot.yes { background: var(--pink); }
.slide-head { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.slide-head h3 { margin: 0; font-size: 20px; font-weight: 800; text-wrap: balance; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.rec { background: var(--blend); color: #0c0d12; }
.story { background: var(--soft); border-radius: 14px; padding: 12px 14px; }
.story b { font-weight: 700; }

/* phones */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }
.side { display: grid; gap: 8px; justify-items: center; min-width: 0; }
.tag { font-size: 13px; font-weight: 700; padding: 0 12px; border-radius: 999px; }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.good { background: var(--good-bg); color: var(--good); }
.phone { width: 100%; max-width: 270px; background: var(--phone); border: 6px solid var(--phone-edge); border-radius: 28px; padding: 12px 12px 16px; display: grid; gap: 10px; align-content: start; min-height: 210px; }
.bar { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.screen-title { font-size: 13px; font-weight: 700; color: var(--muted); }
.sms { background: var(--bubble); border-radius: 14px 14px 14px 4px; padding: 8px 10px; font-size: 13px; line-height: 1.8; }
.sms.bad { outline: 2px solid var(--bad); }
.push { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; font-size: 13px; line-height: 1.8; display: grid; gap: 6px; }
.push b { font-weight: 700; }
.bk { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 6px; font-size: 13px; }
.bk .t { display: flex; justify-content: space-between; gap: 8px; }
.bk .t b { font-weight: 700; }
.state { font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.mbtn { font-size: 12px; font-weight: 700; border-radius: 10px; padding: 3px 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.mbtn.danger { color: var(--bad); border-color: var(--bad); }
.mbtn.main { background: var(--violet); color: var(--on-accent); border-color: var(--violet); }
.mbtn.gone { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.note { font-size: 12px; color: var(--muted); }
.empty { font-size: 13px; color: var(--muted); text-align: center; padding-block: 36px; }
.stat { display: flex; gap: 8px; flex-wrap: wrap; }
.stat span { background: var(--soft); border-radius: 8px; padding: 0 8px; font-size: 12px; }
.stat .no { color: var(--bad); }
.cost { font-size: 14px; color: var(--muted); }

/* answers */
.answer { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .opt button { font: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; padding: 8px 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"][data-v="yes"] { background: var(--violet); border-color: var(--violet); color: var(--on-accent); }
.seg button[aria-pressed="true"][data-v="no"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"][data-v="later"] { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.q { display: grid; gap: 6px; }
.q p { font-size: 14px; font-weight: 700; }
.opt { display: flex; gap: 8px; flex-wrap: wrap; }
.opt button { border-radius: 999px; padding: 3px 14px; font-weight: 500; }
.opt button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: var(--on-accent); }
textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; line-height: 1.8; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--paper); color: var(--ink); resize: vertical; }
.slide textarea { min-height: 70px; }
#opinion { min-height: 160px; background: var(--soft); }
.mic { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.mic svg { flex: none; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

/* tray */
.tray { position: fixed; inset: auto 0 0; background: var(--paper); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.tray-in { direction: rtl; max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tray-text { font-size: 14px; min-width: 0; flex: 1 1 220px; display: grid; }
.tray-text b { font-weight: 800; }
.save-state { font-size: 12px; color: var(--muted); }
.copy { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 8px 16px; background: var(--ink); color: var(--paper); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>

<div class="wrap" id="app">
  <header style="display:grid;gap:10px">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
  </header>

  <section class="problem" aria-labelledby="pTitle">
    <h2 id="pTitle">مشکل چیست</h2>
    <p class="lead" id="pLead"></p>
    <div class="cast" id="cast"></div>
    <div class="issues" id="issues"></div>
  </section>

  <section aria-labelledby="cTitle">
    <div class="carousel-head">
      <h2 id="cTitle">پیشنهادها</h2>
      <div class="nav">
        <button type="button" id="prev" aria-label="پیشنهاد قبلی">›</button>
        <span class="count" id="count"></span>
        <button type="button" id="next" aria-label="پیشنهاد بعدی">‹</button>
      </div>
    </div>
    <p class="muted">برای دیدن بقیه، صفحه را به چپ و راست بکش. زیر هر پیشنهاد بگو می‌خواهی یا نه.</p>
    <div class="track" id="track" role="region" aria-label="پیشنهادها"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section aria-labelledby="oTitle">
    <h2 id="oTitle">نظر خودت</h2>
    <div class="mic">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="var(--violet)"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" stroke="var(--violet)" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>
      <span>برای حرف زدن به‌جای تایپ، روی جعبهٔ پایین بزن، بعد روی علامت میکروفونِ کیبورد گوشی. هر چقدر طولانی باشد اشکالی ندارد.</span>
    </div>
    <textarea id="opinion" aria-label="نظر خودت" placeholder="هر چیزی که می‌خواهی بگویی: پیشنهاد تازه، تغییر در یکی از پیشنهادها، یا سؤال."></textarea>
  </section>
</div>

<div class="tray"><div class="tray-in">
  <p class="tray-text"><span id="progress"></span><span class="save-state" id="saveState"></span></p>
  <button class="copy" id="copy" type="button">کپی خلاصه</button>
</div></div>

<script>
/* ===== The only part that changes from page to page ===== */
const PAGE = {
  id: "example",                       // short latin id; answers are saved under it
  eyebrow: "فرفرو · تصمیم",
  title: "عنوان: سؤالی که باید جواب بدهی",
  problem: {
    lead: "خلاصهٔ مشکل در یک یا دو جملهٔ ساده، از دید کسی که اپ را دارد.",
    cast: [{ name: "سارا", role: "مشتری" }],
    issues: [{ title: "یک مشکل", text: "با یک مثال واقعی.", level: "high" }]
  },
  proposals: [{
    id: "p1", title: "پیشنهاد", size: "کوچک", recommended: true,
    story: "قصهٔ کوتاه با اسم و ساعت.",
    today: { phone: "گوشی سارا", time: "۱۸:۴۰", screen: "پیامک", blocks: [{ sms: "متن", bad: true }] },
    after: { phone: "گوشی سارا", time: "۱۸:۴۰", screen: "پیامک", blocks: [{ empty: "هیچ پیامی نیست" }] },
    cost: "",
    questions: []
  }]
};
/* ===== End of the part that changes ===== */

(function () {
  const $ = (id) => document.getElementById(id);
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  /* story and issue text may use **bold** */
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const ANSWERS = { yes: "می‌خواهم", no: "نمی‌خواهم", later: "بعداً" };
  const STORE_KEY = `frfro-decision-${PAGE.id}`;

  const state = { answers: {}, picks: {}, notes: {}, opinion: "" };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
  PAGE.proposals.forEach((p) => (p.questions || []).forEach((q) => {
    const key = `${p.id}.${q.id}`;
    if (!(key in state.picks) && q.default != null) state.picks[key] = q.default;
  }));

  function block(b) {
    if (b.sms) return `<div class="sms${b.bad ? " bad" : ""}">${esc(b.sms)}</div>`;
    if (b.push) return `<div class="push"><b>${esc(b.push)}</b>${b.text ? `<span>${esc(b.text)}</span>` : ""}${buttons(b.buttons)}</div>`;
    if (b.card) return `<div class="bk"><div class="t"><b>${esc(b.card)}</b>${b.state ? `<span class="state">${esc(b.state)}</span>` : ""}</div>${b.note ? `<span class="note">${esc(b.note)}</span>` : ""}${b.stats ? `<div class="stat">${b.stats.map((s) => `<span class="${s.bad ? "no" : ""}">${esc(s.text)}</span>`).join("")}</div>` : ""}${buttons(b.buttons)}</div>`;
    if (b.empty) return `<p class="empty">${esc(b.empty)}</p>`;
    if (b.note) return `<p class="note">${esc(b.note)}</p>`;
    return "";
  }
  function buttons(list) {
    if (!list || !list.length) return "";
    return `<div class="btns">${list.map((x) => `<span class="mbtn ${x.kind || ""}">${esc(x.text)}</span>`).join("")}</div>`;
  }
  function phone(side, label, cls) {
    return `<div class="side"><span class="tag ${cls}">${label}</span><div class="phone">
      <div class="bar"><span>${esc(side.phone)}</span><span>${esc(side.time || "")}</span></div>
      ${side.screen ? `<div class="screen-title">${esc(side.screen)}</div>` : ""}
      ${(side.blocks || []).map(block).join("")}</div></div>`;
  }

  $("eyebrow").textContent = PAGE.eyebrow || "";
  $("title").textContent = PAGE.title;
  $("pLead").innerHTML = rich(PAGE.problem.lead);
  $("cast").innerHTML = (PAGE.problem.cast || []).map((c) => `<span class="who"><b>${esc(c.name)}</b> ${esc(c.role)}</span>`).join("");
  $("issues").innerHTML = (PAGE.problem.issues || []).map((i) => `<div class="issue${i.level === "high" ? "" : " mid"}"><b>${esc(i.title)}</b><span>${rich(i.text)}</span></div>`).join("");

  const track = $("track");
  track.innerHTML = PAGE.proposals.map((p, i) => `
    <article class="slide" id="slide-${p.id}" data-id="${p.id}" aria-label="پیشنهاد ${fa(i + 1)} از ${fa(PAGE.proposals.length)}">
      <div class="slide-head"><h3>${fa(i + 1)}. ${esc(p.title)}</h3><div class="chips">${p.recommended ? '<span class="chip rec">پیشنهاد من</span>' : ""}${p.size ? `<span class="chip">${esc(p.size)}</span>` : ""}${p.where ? `<span class="chip">${esc(p.where)}</span>` : ""}</div></div>
      <p class="story">${rich(p.story)}</p>
      <div class="pair">${phone(p.today, "امروز", "bad")}${phone(p.after, "با این تغییر", "good")}</div>
      ${p.cost ? `<p class="cost">${rich(p.cost)}</p>` : ""}
      <div class="answer">
        <div class="seg" role="group" aria-label="جواب">${Object.entries(ANSWERS).map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="false">${t}</button>`).join("")}</div>
        ${(p.questions || []).map((q) => `<div class="q" data-q="${p.id}.${q.id}"><p>${esc(q.text)}</p><div class="opt">${q.options.map((o) => `<button type="button" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}</div></div>`).join("")}
        <textarea id="note-${p.id}" aria-label="نظرت دربارهٔ این پیشنهاد" placeholder="نظرت دربارهٔ همین یکی (اختیاری؛ با میکروفون کیبورد هم می‌شود)"></textarea>
      </div>
    </article>`).join("");
  $("dots").innerHTML = PAGE.proposals.map((p, i) => `<button type="button" class="dot" data-i="${i}" aria-label="برو به پیشنهاد ${fa(i + 1)}"></button>`).join("");

  const slides = [...track.querySelectorAll(".slide")];
  let current = 0;
  function go(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    const s = slides[current];
    s.scrollIntoView({ inline: "center", block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    paintNav();
  }
  function paintNav() {
    $("count").textContent = `${fa(current + 1)} از ${fa(slides.length)}`;
    $("prev").disabled = current === 0;
    $("next").disabled = current === slides.length - 1;
    document.querySelectorAll(".dot").forEach((d, i) => {
      d.setAttribute("aria-current", String(i === current));
      d.classList.toggle("yes", state.answers[PAGE.proposals[i].id] === "yes" && i !== current);
    });
  }
  $("prev").addEventListener("click", () => go(current - 1));
  $("next").addEventListener("click", () => go(current + 1));
  $("dots").addEventListener("click", (e) => { const d = e.target.closest(".dot"); if (d) go(Number(d.dataset.i)); });
  const seen = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting && en.intersectionRatio > 0.6) { current = slides.indexOf(en.target); paintNav(); } });
  }, { root: track, threshold: [0.6] });
  slides.forEach((s) => seen.observe(s));

  function paint() {
    slides.forEach((s) => {
      const id = s.dataset.id;
      const a = state.answers[id] || "";
      s.dataset.answer = a;
      s.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === a)));
      s.querySelectorAll(".q").forEach((q) => {
        q.hidden = a !== "yes";
        q.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(state.picks[q.dataset.q] === b.dataset.o)));
      });
      const note = s.querySelector("textarea");
      if (document.activeElement !== note) note.value = state.notes[id] || "";
    });
    if (document.activeElement !== $("opinion")) $("opinion").value = state.opinion || "";
    const answered = PAGE.proposals.filter((p) => state.answers[p.id]).length;
    const yes = PAGE.proposals.filter((p) => state.answers[p.id] === "yes").map((p) => p.title);
    $("progress").innerHTML = `<b>${fa(answered)} از ${fa(PAGE.proposals.length)} جواب داده شد.</b>${yes.length ? ` می‌خواهم: ${esc(yes.join("، "))}` : ""}`;
    paintNav();
  }

  function summary() {
    const lines = [`${PAGE.title}`];
    PAGE.proposals.forEach((p, i) => {
      const a = state.answers[p.id];
      const picks = (p.questions || []).map((q) => state.picks[`${p.id}.${q.id}`]).filter(Boolean);
      lines.push(`${fa(i + 1)}. ${p.title}: ${a ? ANSWERS[a] : "بی‌جواب"}${a === "yes" && picks.length ? ` (${picks.join("، ")})` : ""}${state.notes[p.id] ? `\n   نظر: ${state.notes[p.id]}` : ""}`);
    });
    if (state.opinion) lines.push(`نظر خودم: ${state.opinion}`);
    return lines.join("\n");
  }

  /* Saving: the answers go to the page's shared store, where Claude reads them from any session.
     Without it (a preview, or not signed in) they stay in this browser and the copy button is the way. */
  let db = null, me = null, timer = null, saving = Promise.resolve();
  const setSave = (t) => { $("saveState").textContent = t; };
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    if (!db || !me) { setSave("در همین گوشی نگه داشته شد؛ برای فرستادن، «کپی خلاصه» را بزن."); return; }
    clearTimeout(timer);
    setSave("در حال ذخیره…");
    timer = setTimeout(() => {
      const body = { page: PAGE.id, answers: state.answers, picks: state.picks, notes: state.notes, opinion: state.opinion, summary: summary(), savedAt: new Date().toISOString() };
      saving = saving.then(() => db.doc(`answers/${me}`).set(body))
        .then(() => setSave("ذخیره شد؛ Claude می‌تواند بخواند."))
        .catch(() => setSave("ذخیره نشد؛ «کپی خلاصه» را بزن و برایش بفرست."));
    }, 900);
  }

  track.addEventListener("click", (e) => {
    const slide = e.target.closest(".slide");
    if (!slide) return;
    const seg = e.target.closest(".seg button");
    const opt = e.target.closest(".opt button");
    if (seg) { state.answers[slide.dataset.id] = state.answers[slide.dataset.id] === seg.dataset.v ? "" : seg.dataset.v; }
    else if (opt) { state.picks[opt.closest(".q").dataset.q] = opt.dataset.o; }
    else return;
    paint(); save();
  });
  track.addEventListener("input", (e) => {
    if (e.target.matches("textarea")) { state.notes[e.target.closest(".slide").dataset.id] = e.target.value; paint(); save(); }
  });
  $("opinion").addEventListener("input", (e) => { state.opinion = e.target.value; paint(); save(); });
  $("copy").addEventListener("click", () => {
    const btn = $("copy");
    const text = summary();
    const done = () => { btn.textContent = "کپی شد"; setTimeout(() => { btn.textContent = "کپی خلاصه"; }, 1600); };
    const fallback = () => { const o = $("opinion"); o.value = text; o.focus(); o.select(); btn.textContent = "متن انتخاب شد"; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  });

  paint();
  setSave("");
  (async () => {
    try {
      const [store, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
      if (!store || !user) { setSave("در همین گوشی نگه داشته می‌شود؛ برای فرستادن، «کپی خلاصه» را بزن."); return; }
      const id = await user.id();
      if (!id) return;
      db = store; me = id;
      const snap = await db.doc(`answers/${me}`).get();
      if (snap.exists) {
        const saved = snap.data();
        state.answers = { ...saved.answers }; state.picks = { ...state.picks, ...saved.picks };
        state.notes = { ...saved.notes }; state.opinion = saved.opinion || "";
        paint();
        setSave("جواب‌های قبلی‌ات برگشت.");
      }
    } catch (e) {}
  })();
})();
</script>
