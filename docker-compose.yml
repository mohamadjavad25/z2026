# Local development Postgres. Usage:
#   npm run db:up

services:
  db:
    image: postgres:16
    container_name: zibaban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zibaban
      POSTGRES_PASSWORD: zibaban
      POSTGRES_DB: zibaban
    ports:
      - "5432:5432"
    volumes:
      - zibaban-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zibaban -d zibaban"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zibaban-pgdata:
